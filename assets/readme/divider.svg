<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" preserveAspectRatio="none" role="img" aria-label="">
<defs>
<style>.pulse{animation:run 4s linear infinite}.blip{animation:blip 1.3s steps(1) infinite}@keyframes run{from{transform:translateX(-300px)}to{transform:translateX(1000px)}}@keyframes blip{0%{opacity:1}8%{opacity:0}50%{opacity:1}54%{opacity:0}62%{opacity:1}}@media (prefers-reduced-motion:reduce){.pulse,.blip{animation:none}.pulse{opacity:0}}</style>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#fcee0a" stop-opacity="0"/><stop offset=".2" stop-color="#fcee0a"/><stop offset=".5" stop-color="#ff003c"/><stop offset=".8" stop-color="#fcee0a"/><stop offset="1" stop-color="#fcee0a" stop-opacity="0"/></linearGradient>
<linearGradient id="spark" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect x="0" y="5" width="1000" height="4" fill="url(#line)" opacity=".5" filter="url(#glow)"/>
<rect x="0" y="6.5" width="1000" height="1" fill="url(#line)"/>
<g class="blip"><rect x="412" y="4" width="46" height="2" fill="#00f0ff"/><rect x="560" y="8" width="22" height="2" fill="#ff003c"/></g>
<rect class="pulse" x="0" y="5.5" width="300" height="3" fill="url(#spark)" filter="url(#glow)"/>
</svg>
