<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- chamfered plate, Cyberpunk UI style: two cut corners -->
    <clipPath id="plate">
      <path d="M36 8 H248 V200 L200 248 H8 V36 Z"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a24"/>
      <stop offset="1" stop-color="#05030a"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".05"/>
    </pattern>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#fcee0a"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the power symbol -->
    <g id="power" fill="none" stroke-linecap="square" stroke-width="22">
      <path d="M86 78 A62 62 0 1 0 170 78"/>
      <path d="M128 50 V124"/>
    </g>
    <clipPath id="sliceA"><rect x="0" y="96" width="256" height="18"/></clipPath>
    <clipPath id="sliceB"><rect x="0" y="168" width="256" height="10"/></clipPath>
    <clipPath id="rest">
      <path d="M0 0 H256 V96 H0 Z M0 114 H256 V168 H0 Z M0 178 H256 V256 H0 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <!-- hazard stripes in the cut corner -->
    <path d="M200 248 L248 200 V248 Z" fill="url(#hazard)" opacity=".9"/>
    <!-- HUD ticks -->
    <g fill="#00f0ff" opacity=".55">
      <rect x="20" y="52" width="3" height="40"/>
      <rect x="20" y="100" width="3" height="10"/>
      <rect x="233" y="56" width="3" height="24"/>
      <rect x="233" y="88" width="3" height="60"/>
    </g>

    <!-- chromatic aberration ghosts -->
    <g clip-path="url(#rest)">
      <use xlink:href="#power" stroke="#ff003c" transform="translate(-7 0)" opacity=".95"/>
      <use xlink:href="#power" stroke="#00f0ff" transform="translate(7 0)" opacity=".95"/>
      <use xlink:href="#power" stroke="#fcee0a" filter="url(#glow)"/>
    </g>
    <!-- torn slices, shifted sideways -->
    <g clip-path="url(#sliceA)">
      <use xlink:href="#power" stroke="#00f0ff" transform="translate(-14 0)"/>
      <use xlink:href="#power" stroke="#fcee0a" transform="translate(-22 0)"/>
    </g>
    <g clip-path="url(#sliceB)">
      <use xlink:href="#power" stroke="#ff003c" transform="translate(26 0)"/>
      <use xlink:href="#power" stroke="#fcee0a" transform="translate(18 0)"/>
    </g>

    <!-- corrupted blocks -->
    <rect x="186" y="98" width="30" height="8" fill="#ff003c"/>
    <rect x="34" y="170" width="18" height="6" fill="#00f0ff"/>
    <rect x="60" y="214" width="44" height="6" fill="#fcee0a"/>
    <rect x="110" y="214" width="10" height="6" fill="#fcee0a"/>

    <rect width="256" height="256" fill="url(#scan)"/>
  </g>
  <!-- plate outline -->
  <path d="M36 8 H248 V200 L200 248 H8 V36 Z" fill="none" stroke="#fcee0a" stroke-width="4"/>
  <path d="M8 36 L36 8" stroke="#ff003c" stroke-width="4"/>
</svg>
